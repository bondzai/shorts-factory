[project]
name = "shorts-factory"
version = "0.1.0"
description = "Generator-slot content pipeline for YouTube Shorts / FB Reels"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.30",
    "pydantic>=2.7",
    "pymunk>=6.6",
    "pillow>=10.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]
agent = ["mcp>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "mcp>=2.0"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["schema.sql", "static/*.html"]
