[project]
name = "shorts-factory"
version = "0.1.0"
description = "Generator-slot content pipeline for YouTube Shorts / FB Reels"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.30",
    "pydantic>=2.7",
    "pymunk>=6.6",
    "pygame-ce>=2.5",
    "pillow>=10.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "mcp>=2.0",  # the MCP server agents connect to; was only ever installed by hand
]

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]
# mcp moved into the core dependencies: the MCP server is how agents work the
# queue, not an add-on. `agent` stays as an alias so old install lines work.
agent = []
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
# The whole static tree: the Vite build under static/dist (index.html and
# hashed assets) and the logo. This said static/*.html once, from before
# there was a build, and a pip-installed factory served a console with no
# assets — found when the Docker image would not start.
factory = ["schema.sql", "static/*", "static/dist/*", "static/dist/assets/*"]
