<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shorts factory</title>
<style>
  :root {
    --bg: #12121a; --panel: #1a1a24; --line: #2b2b38; --ink: #e8e8ef;
    --dim: #8f8fa3; --ok: #97c459; --no: #e84c4a; --key: #efa027;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); position: sticky;
    top: 0; background: var(--bg); z-index: 5;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; font-size: 12.5px; color: var(--dim);
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .grow { flex: 1; }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 13px; font: inherit; font-size: 13.5px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #45455a; }
  button:disabled { opacity: .45; cursor: default; }
  button.ok { border-color: #3f5a24; color: var(--ok); }
  button.no { border-color: #5e2422; color: var(--no); }
  main { padding: 22px; max-width: 1180px; margin: 0 auto; }
  .bar { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; }
  #log {
    background: #0d0d14; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font: 12.5px/1.6 ui-monospace, SFMono-Regular, monospace;
    color: var(--dim); white-space: pre-wrap; max-height: 230px; overflow: auto;
    margin-bottom: 20px;
  }
  .clip { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
  @media (max-width: 760px) { .clip { grid-template-columns: 1fr; } }
  video {
    width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 12px;
    border: 1px solid var(--line); display: block;
  }
  .meta h2 { font-size: 19px; margin: 0 0 6px; line-height: 1.35; }
  .tags { color: #6f9fd8; font-size: 13.5px; margin-bottom: 12px; }
  .desc { color: var(--dim); font-size: 13.5px; margin-bottom: 16px; white-space: pre-wrap; }
  dl { display: grid; grid-template-columns: 116px 1fr; gap: 5px 14px; margin: 0 0 18px;
       font-size: 13px; }
  dt { color: var(--dim); }
  dd { margin: 0; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  kbd {
    background: #24242f; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font: 11.5px ui-monospace, monospace;
    color: var(--key);
  }
  .strip { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .strip button { font-size: 12px; padding: 5px 10px; }
  .strip button[aria-current="true"] { border-color: var(--key); color: var(--key); }
  .empty { color: var(--dim); padding: 40px 0; }
  .hint { color: var(--dim); font-size: 12.5px; }
  a { color: #6f9fd8; }
</style>
</head>
<body>
<header>
  <h1>shorts factory</h1>
  <div class="pills" id="pills"></div>
  <div class="grow"></div>
  <span class="pill">spend <b id="spend">$0</b></span>
  <span class="pill">driver <b id="driver">—</b></span>
</header>

<main>
  <div class="bar">
    <button data-plan="1">Plan 1</button>
    <button data-plan="3">Plan 3</button>
    <button data-plan="5">Plan 5</button>
    <button id="build">Build</button>
    <button id="publish">Publish approved</button>
    <button id="digest">Digest</button>
    <span class="grow"></span>
    <button id="sound">Sound: off</button>
  </div>

  <div id="log" hidden></div>
  <div id="stage"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let state = null, index = 0, sound = false, busy = false;

const fmt = (n, d = 1) => (n === null || n === undefined) ? "—" : Number(n).toFixed(d);

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}

async function post(path, body) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
}

async function refresh() {
  try {
    state = await api("/api/state");
  } catch (err) {
    $("#stage").innerHTML = `<p class="empty">cannot reach the server: ${err.message}</p>`;
    return;
  }
  busy = state.job.running;
  render();
}

function renderPills() {
  const order = ["planned", "awaiting_approval", "approved", "published", "qc_rejected", "failed"];
  const counts = state.counts || {};
  $("#pills").innerHTML = order
    .filter((k) => counts[k])
    .map((k) => `<span class="pill">${k.replace(/_/g, " ")} <b>${counts[k]}</b></span>`)
    .join("");
  $("#spend").textContent = "$" + Number(state.spend_usd).toFixed(4);
  $("#driver").textContent = state.driver;
}

function renderLog() {
  const log = $("#log");
  const lines = state.job.log;
  log.hidden = lines.length === 0;
  if (lines.length) {
    const label = state.job.running ? `${state.job.name} running…\n` : "";
    log.textContent = label + lines.join("\n");
    log.scrollTop = log.scrollHeight;
  }
  document.querySelectorAll("button[data-plan], #build, #publish, #digest")
    .forEach((b) => (b.disabled = busy));
}

function renderClip() {
  const queue = state.queue;
  const stage = $("#stage");
  if (!queue.length) {
    stage.innerHTML = `<p class="empty">Queue is empty. Plan some clips, then Build —
      whatever survives QC shows up here.</p>`;
    return;
  }
  index = Math.min(index, queue.length - 1);
  const c = queue[index];
  const qc = c.qc || {};
  stage.innerHTML = `
    <div class="clip">
      <video id="player" src="/api/clip/${c.id}/video" autoplay loop playsinline
             ${sound ? "" : "muted"} controls></video>
      <div class="meta">
        <h2>${escape(c.title || "(no title)")}</h2>
        <div class="tags">${(c.hashtags || []).map(escape).join(" ")}</div>
        <div class="desc">${escape(c.description || "")}</div>
        <dl>
          <dt>clip</dt><dd>${c.id} · ${c.generator}/${c.variant} · seed ${c.seed}</dd>
          <dt>shows</dt><dd>${escape(c.render_desc || "—")}</dd>
          <dt>intended hook</dt><dd>${escape(c.hook || "—")}</dd>
          <dt>length</dt><dd>${fmt(c.duration_s)}s</dd>
          <dt>loudness</dt><dd>${fmt(c.loudness_lufs)} LUFS</dd>
          <dt>sameness</dt><dd>${fmt(c.sameness, 3)}</dd>
          <dt>QC hook</dt><dd>${qc.hook_strength ?? "—"}/5 · policy ${qc.policy_risk ?? "—"}</dd>
          <dt>QC notes</dt><dd>${(qc.reasons || []).map(escape).join("<br>") || "—"}</dd>
          <dt>cost</dt><dd>$${Number(c.cost_usd || 0).toFixed(4)}</dd>
        </dl>
        <div class="actions">
          <button class="ok" id="approve">Approve <kbd>A</kbd></button>
          <button class="no" id="reject">Reject <kbd>R</kbd></button>
          <span class="hint">${index + 1} of ${queue.length} · <kbd>J</kbd> <kbd>K</kbd> to move</span>
        </div>
      </div>
    </div>
    <div class="strip">
      ${queue.map((q, i) => `<button data-go="${i}" aria-current="${i === index}">
        ${i + 1}. ${escape((q.title || q.id).slice(0, 34))}</button>`).join("")}
    </div>`;

  $("#approve").onclick = () => decide(c.id, "approve");
  $("#reject").onclick = () => decide(c.id, "reject");
  document.querySelectorAll("[data-go]").forEach((b) => {
    b.onclick = () => { index = Number(b.dataset.go); renderClip(); };
  });
}

function escape(text) {
  return String(text).replace(/[&<>"]/g, (ch) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

async function decide(id, what) {
  const body = what === "reject" ? { reason: "rejected in review" } : {};
  try {
    await post(`/api/clip/${id}/${what}`, body);
  } catch (err) {
    alert(err.message);
  }
  await refresh();
}

function render() {
  renderPills();
  renderLog();
  renderClip();
}

document.querySelectorAll("button[data-plan]").forEach((b) => {
  b.onclick = async () => {
    try { await post("/api/plan", { count: Number(b.dataset.plan) }); }
    catch (err) { alert(err.message); }
    refresh();
  };
});
for (const [id, path] of [["build", "/api/build"], ["publish", "/api/publish"], ["digest", "/api/digest"]]) {
  $("#" + id).onclick = async () => {
    try { await post(path); } catch (err) { alert(err.message); }
    refresh();
  };
}
$("#sound").onclick = () => {
  sound = !sound;
  $("#sound").textContent = "Sound: " + (sound ? "on" : "off");
  const player = $("#player");
  if (player) { player.muted = !sound; player.play().catch(() => {}); }
};

document.addEventListener("keydown", (event) => {
  // event.target can be the document, which has no matches() — calling it
  // blind throws and silently kills every shortcut.
  if (event.target?.matches?.("input, textarea")) return;
  const queue = state?.queue || [];
  if (!queue.length) return;
  const current = queue[index];
  if (event.key === "a" || event.key === "A") decide(current.id, "approve");
  else if (event.key === "r" || event.key === "R") decide(current.id, "reject");
  else if (event.key === "j" || event.key === "J") { index = Math.min(index + 1, queue.length - 1); renderClip(); }
  else if (event.key === "k" || event.key === "K") { index = Math.max(index - 1, 0); renderClip(); }
  else if (event.key === " ") {
    event.preventDefault();
    const player = $("#player");
    if (player) player.paused ? player.play() : player.pause();
  }
});

refresh();
setInterval(() => { if (busy) refresh(); }, 1500);
</script>
</body>
</html>
