<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shorts factory</title>
<style>
  :root {
    --bg: #12121a; --panel: #1a1a24; --panel2: #20202c; --line: #2b2b38;
    --ink: #e8e8ef; --dim: #8f8fa3; --faint: #63637a;
    --ok: #97c459; --no: #e84c4a; --key: #efa027; --link: #6f9fd8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); display: flex;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  nav {
    width: 214px; flex-shrink: 0; border-right: 1px solid var(--line);
    padding: 18px 12px; min-height: 100vh; position: sticky; top: 0;
  }
  .brand { font-size: 15px; font-weight: 600; padding: 0 8px 14px; }
  nav a {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    font-size: 13.5px; color: var(--dim); border-radius: 8px; cursor: pointer;
    text-decoration: none;
  }
  nav a[aria-current="true"] { background: var(--panel2); color: var(--ink); }
  nav a .count {
    background: var(--line); color: var(--dim); border-radius: 999px;
    font-size: 11px; padding: 1px 7px;
  }
  nav a[aria-current="true"] .count { background: var(--key); color: #412402; }
  .group { font-size: 11px; letter-spacing: .09em; color: var(--faint); padding: 16px 8px 6px; }
  .wrap { flex: 1; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 22px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  main { padding: 20px 22px 40px; max-width: 1120px; }
  button, select, input, textarea {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13.5px;
  }
  button, select { cursor: pointer; }
  button:hover:not(:disabled) { border-color: #45455a; }
  button:disabled { opacity: .45; cursor: default; }
  button.ok { border-color: #3f5a24; color: var(--ok); }
  button.no { border-color: #5e2422; color: var(--no); }
  button.small { font-size: 12px; padding: 4px 10px; }
  .pill {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; font-size: 12.5px; color: var(--dim);
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .grow { flex: 1; }
  .bar { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  #log {
    background: #0d0d14; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font: 12.5px/1.6 ui-monospace, SFMono-Regular, monospace;
    color: var(--dim); white-space: pre-wrap; max-height: 220px; overflow: auto;
    margin-bottom: 18px;
  }
  .clip { display: grid; grid-template-columns: 290px 1fr; gap: 22px; }
  @media (max-width: 820px) { .clip { grid-template-columns: 1fr; } body { display: block; } nav { width: auto; min-height: 0; position: static; } }
  video { width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 12px; border: 1px solid var(--line); display: block; }
  h2 { font-size: 19px; margin: 0 0 6px; line-height: 1.35; font-weight: 500; }
  .tags { color: var(--link); font-size: 13.5px; margin-bottom: 10px; }
  .desc { color: var(--dim); font-size: 13.5px; margin-bottom: 14px; white-space: pre-wrap; }
  dl { display: grid; grid-template-columns: 112px 1fr; gap: 5px 14px; margin: 0 0 16px; font-size: 13px; }
  dt { color: var(--dim); } dd { margin: 0; }
  kbd { background: #24242f; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font: 11.5px ui-monospace, monospace; color: var(--key); }
  .strip { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .strip button[aria-current="true"] { border-color: var(--key); color: var(--key); }
  .empty { color: var(--dim); padding: 36px 0; }
  .hint { color: var(--dim); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 400; color: var(--faint); font-size: 11.5px; padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 10px; border-bottom: 1px solid #1f1f29; vertical-align: top; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 11px; margin-bottom: 18px; }
  .tile { background: var(--panel); border-radius: 10px; padding: 12px 14px; }
  .tile .label { font-size: 11.5px; color: var(--faint); margin-bottom: 4px; }
  .tile .value { font-size: 23px; font-weight: 500; }
  .tile .sub { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 15px 17px; margin-bottom: 14px; }
  .meter { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .meter span { display: block; height: 7px; background: #3a3a4a; border-radius: 4px; }
  .note { border: 1px dashed var(--line); border-radius: 10px; padding: 13px 15px; font-size: 12.5px; color: var(--faint); line-height: 1.75; }
  textarea { width: 100%; min-height: 380px; font: 12.5px/1.9 ui-monospace, SFMono-Regular, monospace; background: #0e0e15; }
  .badge { border-radius: 999px; font-size: 11.5px; padding: 2px 9px; }
</style>
</head>
<body>
<nav>
  <div class="brand">shorts factory</div>
  <div class="group">DAILY</div>
  <a data-view="review" aria-current="true">Review <span class="grow"></span><span class="count" id="n-review">0</span></a>
  <a data-view="library">Library</a>
  <a data-view="analytics">Analytics</a>
  <div class="group">SYSTEM</div>
  <a data-view="rules">Rules <span class="grow"></span><span class="count" id="n-rules">0</span></a>
  <a data-view="runs">Runs</a>
  <a data-view="logs">Logs</a>
</nav>

<div class="wrap">
<header>
  <select id="channel" aria-label="Channel"></select>
  <div class="pills" id="pills" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <div class="grow"></div>
  <span class="pill">this <b id="spend">$0</b></span>
  <span class="pill">all <b id="spendall">$0</b></span>
</header>

<main>
  <div class="bar">
    <button data-plan="1">Plan 1</button>
    <button data-plan="3">Plan 3</button>
    <button id="build">Build</button>
    <button id="publish">Publish approved</button>
    <button id="digest">Digest</button>
    <span class="grow"></span>
    <button id="addchannel">Add channel</button>
    <button id="sound">Sound: off</button>
  </div>
  <div id="log" hidden></div>
  <div id="stage"></div>
</main>
</div>

<script>
const $ = (s) => document.querySelector(s);
let state = null, channels = [], channel = null, view = "review";
let index = 0, sound = false, busy = false, filters = {};

const fmt = (n, d = 1) => (n === null || n === undefined) ? "—" : Number(n).toFixed(d);
const num = (n) => (n === null || n === undefined) ? "—" : Number(n).toLocaleString();
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}
const send = (path, body, method = "POST") => api(path, {
  method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}),
});
const withChannel = (path) => `${path}${path.includes("?") ? "&" : "?"}channel=${encodeURIComponent(channel)}`;

async function loadChannels() {
  const body = await api("/api/channels");
  channels = body.channels;
  if (!channels.length) return;
  if (!channel || !channels.some((c) => c.id === channel)) {
    channel = (channels.find((c) => c.active) || channels[0]).id;
  }
  $("#channel").innerHTML = channels.map((c) =>
    `<option value="${esc(c.id)}" ${c.id === channel ? "selected" : ""}>${esc(c.name)}${c.queue ? ` · ${c.queue} waiting` : ""}${c.active ? "" : " (paused)"}</option>`
  ).join("");
}

async function refresh() {
  try {
    if (!channels.length) await loadChannels();
    if (!channels.length) { $("#stage").innerHTML = `<p class="empty">No channels yet. Add one to start.</p>`; return; }
    state = await api(withChannel("/api/state"));
  } catch (err) {
    $("#stage").innerHTML = `<p class="empty">cannot reach the server: ${esc(err.message)}</p>`;
    return;
  }
  busy = state.job.running;
  renderChrome();
  await renderView();
}

function renderChrome() {
  const order = ["planned", "awaiting_approval", "approved", "published", "qc_rejected", "failed"];
  const counts = state.counts || {};
  $("#pills").innerHTML = order.filter((k) => counts[k])
    .map((k) => `<span class="pill">${k.replace(/_/g, " ")} <b>${counts[k]}</b></span>`).join("");
  $("#spend").textContent = "$" + Number(state.spend_usd).toFixed(4);
  $("#spendall").textContent = "$" + Number(state.spend_total_usd).toFixed(4);
  $("#n-review").textContent = state.queue.length;

  const log = $("#log");
  const lines = state.job.log;
  log.hidden = lines.length === 0;
  if (lines.length) {
    const job = state.job;
    log.textContent = (job.running ? `${job.name} running on ${job.channel_id}…\n` : "") + lines.join("\n");
    log.scrollTop = log.scrollHeight;
  }
  document.querySelectorAll("button[data-plan], #build, #publish, #digest").forEach((b) => (b.disabled = busy));
  document.querySelectorAll("nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.view === view));
}

async function renderView() {
  if (view === "review") return renderReview();
  if (view === "library") return renderLibrary();
  if (view === "analytics") return renderAnalytics();
  if (view === "rules") return renderRules();
  if (view === "runs") return renderRuns();
  if (view === "logs") return renderLogs();
}

/* ---------- review ---------- */
function renderReview() {
  const queue = state.queue, stage = $("#stage");
  if (!queue.length) {
    stage.innerHTML = `<p class="empty">Queue is empty on ${esc(state.channel.name)}.
      ${state.planned ? state.planned + " clip(s) planned — press Build." : "Plan some clips, then Build."}</p>`;
    return;
  }
  index = Math.min(index, queue.length - 1);
  const c = queue[index], qc = c.qc || {};
  stage.innerHTML = `
    <div class="clip">
      <video id="player" src="/api/clip/${c.id}/video" autoplay loop playsinline ${sound ? "" : "muted"} controls></video>
      <div>
        <h2>${esc(c.title || "(no title)")}</h2>
        <div class="tags">${(c.hashtags || []).map(esc).join(" ")}</div>
        <div class="desc">${esc(c.description)}</div>
        <dl>
          <dt>clip</dt><dd>${c.id} · ${c.generator}/${c.variant} · seed ${c.seed}</dd>
          <dt>shows</dt><dd>${esc(c.render_desc || "—")}</dd>
          <dt>intended hook</dt><dd>${esc(c.hook || "—")}</dd>
          <dt>length</dt><dd>${fmt(c.duration_s)}s</dd>
          <dt>loudness</dt><dd>${fmt(c.loudness_lufs)} LUFS</dd>
          <dt>sameness</dt><dd>${fmt(c.sameness, 3)}</dd>
          <dt>QC hook</dt><dd>${qc.hook_strength ?? "—"}/5 · policy ${qc.policy_risk ?? "—"}</dd>
          <dt>QC notes</dt><dd>${(qc.reasons || []).map(esc).join("<br>") || "—"}</dd>
          <dt>cost</dt><dd>$${Number(c.cost_usd || 0).toFixed(4)}</dd>
        </dl>
        <div class="bar">
          <button class="ok" id="approve">Approve <kbd>A</kbd></button>
          <button class="no" id="reject">Reject <kbd>R</kbd></button>
          <span class="hint">${index + 1} of ${queue.length} · <kbd>J</kbd> <kbd>K</kbd> to move</span>
        </div>
      </div>
    </div>
    <div class="strip">${queue.map((q, i) =>
      `<button class="small" data-go="${i}" aria-current="${i === index}">${i + 1}. ${esc((q.title || q.id).slice(0, 32))}</button>`).join("")}</div>`;
  $("#approve").onclick = () => decide(c.id, "approve");
  $("#reject").onclick = () => decide(c.id, "reject");
  document.querySelectorAll("[data-go]").forEach((b) => {
    b.onclick = () => { index = Number(b.dataset.go); renderReview(); };
  });
}

async function decide(id, what) {
  try { await send(`/api/clip/${id}/${what}`, what === "reject" ? { reason: "rejected in review" } : {}); }
  catch (err) { alert(err.message); }
  channels = [];
  await refresh();
}

/* ---------- library ---------- */
async function renderLibrary() {
  const params = new URLSearchParams({ channel });
  for (const [k, v] of Object.entries(filters)) if (v) params.set(k, v);
  const body = await api(`/api/clips?${params}`);
  const chip = (label, key, value) =>
    `<button class="small" data-filter="${key}" data-value="${esc(value)}"
      style="${filters[key] === value ? "border-color:#efa027;color:#efa027" : ""}">${esc(label)}</button>`;
  const modules = Object.entries(body.modules).flatMap(([gen, variants]) =>
    variants.map((v) => chip(v, "variant", v)));
  $("#stage").innerHTML = `
    <div class="bar">
      <input id="q" type="search" placeholder="Search titles" value="${esc(filters.q || "")}" style="width:200px">
      ${chip("all", "status", "")}
      ${body.statuses.map((s) => chip(s.replace(/_/g, " "), "status", s)).join("")}
      <span style="width:12px"></span>
      ${modules.join("")}
    </div>
    <table>
      <thead><tr><th>Title</th><th>Module</th><th>Status</th><th>Views</th><th>Retained</th><th>Swipe away</th><th>Cost</th></tr></thead>
      <tbody>${body.clips.map((c) => `
        <tr>
          <td><div>${esc(c.title || "(untitled)")}</div>
              <div class="hint">${c.id} · seed ${c.seed}${c.reject_reason ? ` · <span style="color:var(--no)">${esc(c.reject_reason.slice(0, 70))}</span>` : ""}</div></td>
          <td class="hint">${esc(c.variant)}</td>
          <td><span class="badge" style="background:var(--panel2);color:var(--dim)">${esc(c.status.replace(/_/g, " "))}</span></td>
          <td>${num(c.views)}</td><td>${fmt(c.avg_view_pct)}${c.avg_view_pct != null ? "%" : ""}</td>
          <td>${fmt(c.swipe_away_pct)}${c.swipe_away_pct != null ? "%" : ""}</td>
          <td class="hint">$${Number(c.cost_usd || 0).toFixed(4)}</td>
        </tr>`).join("") || `<tr><td colspan="7" class="empty">Nothing matches.</td></tr>`}</tbody>
    </table>`;
  document.querySelectorAll("[data-filter]").forEach((b) => {
    b.onclick = () => {
      const key = b.dataset.filter, value = b.dataset.value;
      filters[key] = filters[key] === value ? "" : value;
      renderLibrary();
    };
  });
  $("#q").onchange = (e) => { filters.q = e.target.value; renderLibrary(); };
}

/* ---------- analytics ---------- */
async function renderAnalytics() {
  const a = await api(withChannel("/api/analytics"));
  if (!a.n_with_metrics) {
    $("#stage").innerHTML = `<p class="empty">No published clip has metrics yet.
      Enter them by hand as they come in, or switch the driver to youtube.</p>`;
    return;
  }
  const max = Math.max(...a.series.map((s) => s.views), 1);
  const row = (g) => `
    <div style="margin-bottom:13px">
      <div style="display:flex;font-size:12.5px;margin-bottom:5px">
        <span class="grow">${esc(g.key)}</span><span>${fmt(g.retained_median)}%</span>
        <span class="hint" style="margin-left:8px">n=${g.n}</span></div>
      <div class="meter"><span style="width:${Math.max(2, g.retained_median || 0)}%"></span></div>
    </div>`;
  $("#stage").innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="label">Shorts views, 90 days</div><div class="value">${num(a.views_90d)}</div>
        <div class="sub">${a.gate_tier2_pct}% of the 10M gate</div></div>
      <div class="tile"><div class="label">Published with metrics</div><div class="value">${a.n_with_metrics}</div>
        <div class="sub">of ${a.n_published} published</div></div>
      <div class="tile"><div class="label">Median retained</div><div class="value">${fmt(a.retained_median)}%</div>
        <div class="sub">swipe away ${fmt(a.swipe_away_median)}%</div></div>
      <div class="tile"><div class="label">Best clip</div><div class="value">${num(a.best?.views)}</div>
        <div class="sub">${esc(a.best?.variant || "—")}</div></div>
    </div>
    <div class="card">
      <div style="font-size:13px;margin-bottom:3px">Views per clip, in publish order</div>
      <div class="hint" style="margin-bottom:14px">One clip usually carries a channel. Watch for the tall bar, not the average.</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:150px">
        ${a.series.map((s) => `<div title="${esc(s.title)} · ${num(s.views)} views"
          style="flex:1;height:${Math.max(2, (s.views / max) * 100)}%;background:${s.views === max ? "var(--key)" : "#2b2b38"};border-radius:2px"></div>`).join("")}
      </div>
    </div>
    <div class="card">
      <div style="font-size:13px;margin-bottom:3px">Retention by variant</div>
      <div class="hint" style="margin-bottom:14px">n is shown because at this sample size n is most of the argument.</div>
      ${a.by_variant.map(row).join("")}
    </div>
    <div class="card">
      <div style="font-size:13px;margin-bottom:3px">Retention by QC hook score</div>
      <div class="hint" style="margin-bottom:14px">${esc(a.by_hook_caveat)}</div>
      ${a.by_hook.map((g) => row({ ...g, key: `hook ${g.key}/5` })).join("") || `<div class="hint">No scored clips yet.</div>`}
    </div>`;
}

/* ---------- rules ---------- */
async function renderRules() {
  const r = await api(withChannel("/api/rules"));
  $("#n-rules").textContent = r.proposals.length;
  $("#stage").innerHTML = `
    <div class="bar"><span class="hint">${esc(r.path)}</span><span class="grow"></span>
      <button id="saverules">Save</button></div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px">
      <textarea id="rulestext" spellcheck="false">${esc(r.text)}</textarea>
      <div>
        <div class="hint" style="margin-bottom:9px">Analyst proposals${r.digest ? ` · ${r.digest.n_published} clips with metrics` : ""}</div>
        ${r.proposals.map((p, i) => `
          <div class="card" style="margin-bottom:10px">
            <div style="font-size:13.5px;line-height:1.6;margin-bottom:10px">${esc(p)}</div>
            <button class="ok small" data-accept="${i}">Accept</button>
          </div>`).join("") || `<div class="note">No pending proposals. The Analyst writes nothing below the sample threshold, and never edits this file on its own.</div>`}
      </div>
    </div>`;
  $("#saverules").onclick = async () => {
    try { await send("/api/rules", { channel, text: $("#rulestext").value }, "PUT"); await renderRules(); }
    catch (err) { alert(err.message); }
  };
  document.querySelectorAll("[data-accept]").forEach((b) => {
    b.onclick = async () => {
      try { await send("/api/rules/accept", { channel, rules: [r.proposals[Number(b.dataset.accept)]] }); await renderRules(); }
      catch (err) { alert(err.message); }
    };
  });
}

/* ---------- runs ---------- */
async function renderRuns() {
  const body = await api(withChannel("/api/runs"));
  $("#stage").innerHTML = `
    <table>
      <thead><tr><th>Started</th><th>Job</th><th>Result</th><th>Status</th><th>Cost</th></tr></thead>
      <tbody>${body.runs.map((r) => `
        <tr><td class="hint">${esc(r.started_at)}</td><td>${esc(r.kind)}</td>
        <td class="hint">${esc(r.detail || "")}</td>
        <td style="color:${r.status === "failed" ? "var(--no)" : r.status === "ok" ? "var(--ok)" : "var(--dim)"}">${esc(r.status)}</td>
        <td class="hint">$${Number(r.cost_usd || 0).toFixed(4)}</td></tr>`).join("")
        || `<tr><td colspan="5" class="empty">No runs recorded yet.</td></tr>`}</tbody>
    </table>`;
}

/* ---------- logs ---------- */
async function renderLogs() {
  const params = new URLSearchParams({ channel });
  if (filters.level) params.set("level", filters.level);
  if (filters.event) params.set("event", filters.event);
  const body = await api(`/api/logs?${params}`);
  const chip = (label, key, value) =>
    `<button class="small" data-logfilter="${key}" data-value="${esc(value)}"
      style="${filters[key] === value ? "border-color:#efa027;color:#efa027" : ""}">${esc(label)}</button>`;
  const colour = (l) => l === "error" ? "var(--no)" : l === "warn" ? "var(--key)" : "var(--dim)";
  $("#stage").innerHTML = `
    <div class="bar">
      ${chip("all levels", "level", "")}${chip("warn", "level", "warn")}${chip("error", "level", "error")}
      <span style="width:12px"></span>
      ${chip("all events", "event", "")}${chip("clip.", "event", "clip.")}${chip("agent.", "event", "agent.")}${chip("mcp.", "event", "mcp.")}
    </div>
    <table>
      <thead><tr><th>Time</th><th>Event</th><th>Clip</th><th>By</th><th>Detail</th></tr></thead>
      <tbody>${body.events.map((e) => {
        const extra = Object.fromEntries(Object.entries(e).filter(([k, v]) =>
          !["at", "level", "event", "channel", "clip", "actor"].includes(k) && v !== null));
        return `<tr>
          <td class="hint">${esc(e.at.slice(11, 23))}</td>
          <td style="color:${colour(e.level)}">${esc(e.event)}</td>
          <td class="hint">${esc(e.clip || "")}</td>
          <td class="hint">${esc(e.actor || "")}</td>
          <td class="hint" style="word-break:break-word">${esc(JSON.stringify(extra).slice(0, 160))}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="5" class="empty">No events yet.</td></tr>`}</tbody>
    </table>`;
  document.querySelectorAll("[data-logfilter]").forEach((b) => {
    b.onclick = () => {
      const key = b.dataset.logfilter, value = b.dataset.value;
      filters[key] = filters[key] === value ? "" : value;
      renderLogs();
    };
  });
}

/* ---------- chrome ---------- */
document.querySelectorAll("nav a").forEach((a) => {
  a.onclick = async () => { view = a.dataset.view; renderChrome(); await renderView(); };
});
$("#channel").onchange = async (e) => { channel = e.target.value; index = 0; filters = {}; await refresh(); };
$("#addchannel").onclick = async () => {
  const name = prompt("Channel name (for example: HODL Tales)");
  if (!name) return;
  const handle = prompt("Handle, or leave blank") || null;
  try { const created = await send("/api/channels", { name, handle }); channels = []; channel = created.id; await refresh(); }
  catch (err) { alert(err.message); }
};
document.querySelectorAll("button[data-plan]").forEach((b) => {
  b.onclick = async () => {
    try { await send("/api/plan", { channel, count: Number(b.dataset.plan) }); } catch (err) { alert(err.message); }
    refresh();
  };
});
for (const [id, path] of [["build", "/api/build"], ["publish", "/api/publish"], ["digest", "/api/digest"]]) {
  $("#" + id).onclick = async () => {
    try { await send(path, { channel }); } catch (err) { alert(err.message); }
    refresh();
  };
}
$("#sound").onclick = () => {
  sound = !sound;
  $("#sound").textContent = "Sound: " + (sound ? "on" : "off");
  const p = $("#player");
  if (p) { p.muted = !sound; p.play().catch(() => {}); }
};
document.addEventListener("keydown", (event) => {
  if (event.target?.matches?.("input, textarea, select")) return;
  if (view !== "review") return;
  const queue = state?.queue || [];
  if (!queue.length) return;
  const current = queue[index];
  if (event.key === "a" || event.key === "A") decide(current.id, "approve");
  else if (event.key === "r" || event.key === "R") decide(current.id, "reject");
  else if (event.key === "j" || event.key === "J") { index = Math.min(index + 1, queue.length - 1); renderReview(); }
  else if (event.key === "k" || event.key === "K") { index = Math.max(index - 1, 0); renderReview(); }
  else if (event.key === " ") {
    event.preventDefault();
    const p = $("#player");
    if (p) p.paused ? p.play() : p.pause();
  }
});

refresh();
setInterval(() => { if (busy) refresh(); }, 1500);
</script>
</body>
</html>
