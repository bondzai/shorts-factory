<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shorts factory</title>
<style>
  :root {
    --bg: #12121a; --panel: #1a1a24; --panel2: #20202c; --line: #2b2b38;
    --ink: #e8e8ef; --dim: #8f8fa3; --faint: #63637a;
    --ok: #97c459; --no: #e84c4a; --key: #efa027; --link: #6f9fd8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #root { display: flex; min-height: 100vh; }
  nav { width: 232px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
  .brand { font-size: 15px; font-weight: 600; padding: 0 8px 14px; }
  nav a { display: block; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-decoration: none; color: var(--dim); margin-bottom: 2px; }
  nav a[aria-current="true"] { background: var(--panel2); color: var(--ink); }
  nav a .name { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  nav a .meaning { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
  nav a[aria-current="true"] .meaning { color: var(--dim); }
  .count { margin-left: auto; background: var(--line); color: var(--dim); border-radius: 999px; font-size: 11px; padding: 1px 7px; }
  nav a[aria-current="true"] .count { background: var(--key); color: #412402; }
  .wrap { flex: 1; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header .job { width: 100%; font: 12.5px/1.6 ui-monospace, SFMono-Regular, monospace; color: var(--dim); white-space: pre-wrap; }
  header .job.running { color: var(--key); }
  main { padding: 20px 22px 40px; max-width: 1120px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .lead { color: var(--dim); font-size: 13px; margin: 0 0 18px; }
  button, select, input, textarea { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13.5px; }
  button, select { cursor: pointer; }
  button:hover:not(:disabled) { border-color: #45455a; }
  button:disabled { opacity: .45; cursor: default; }
  button.ok { border-color: #3f5a24; color: var(--ok); }
  button.no { border-color: #5e2422; color: var(--no); }
  button.small { font-size: 12px; padding: 4px 10px; }
  button.chip[aria-pressed="true"] { border-color: var(--key); color: var(--key); }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--dim); }
  .pill b { color: var(--ink); font-weight: 600; }
  .grow { flex: 1; }
  .bar { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .row input { flex: 1; }
  input.title { font-size: 20px; font-weight: 600; width: 100%; margin: 0 0 6px; }
  .clip { display: grid; grid-template-columns: 290px 1fr; gap: 22px; }
  @media (max-width: 820px) { .clip { grid-template-columns: 1fr; } #root { display: block; } nav { width: auto; height: auto; position: static; } }
  video { width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .tags { color: var(--link); font-size: 13.5px; margin-bottom: 10px; }
  .desc { color: var(--dim); font-size: 13.5px; margin-bottom: 14px; white-space: pre-wrap; }
  dl { display: grid; grid-template-columns: 112px 1fr; gap: 5px 14px; margin: 0 0 16px; font-size: 13px; }
  dt { color: var(--dim); } dd { margin: 0; }
  kbd { background: #24242f; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font: 11.5px ui-monospace, monospace; color: var(--key); }
  .strip { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .strip button[aria-current="true"] { border-color: var(--key); color: var(--key); }
  .empty { color: var(--dim); padding: 36px 0; }
  .hint { color: var(--dim); font-size: 12.5px; }
  .warn { color: var(--key); } .bad { color: var(--no); } .good { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 400; color: var(--faint); font-size: 11.5px; padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 10px; border-bottom: 1px solid #1f1f29; vertical-align: top; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 11px; margin-bottom: 18px; }
  .tile { background: var(--panel); border-radius: 10px; padding: 12px 14px; }
  .tile .label { font-size: 11.5px; color: var(--faint); margin-bottom: 4px; }
  .tile .value { font-size: 23px; font-weight: 500; }
  .tile .sub { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 15px 17px; margin-bottom: 14px; }
  .card h3 { font-size: 13.5px; font-weight: 500; margin: 0 0 3px; }
  .meter { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .meter span { display: block; height: 7px; background: #3a3a4a; border-radius: 4px; }
  .note { border: 1px dashed var(--line); border-radius: 10px; padding: 13px 15px; font-size: 12.5px; color: var(--faint); line-height: 1.75; }
  textarea { width: 100%; min-height: 380px; font: 12.5px/1.9 ui-monospace, SFMono-Regular, monospace; background: #0e0e15; }
  .badge { border-radius: 999px; font-size: 11.5px; padding: 2px 9px; background: var(--panel2); color: var(--dim); }
  .run { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .run > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 12px; align-items: baseline; font-size: 13px; }
  .run > summary::-webkit-details-marker { display: none; }
  .run .events { padding: 0 14px 10px; }
  .event { display: grid; grid-template-columns: 78px 150px 1fr; gap: 10px; font-size: 12.5px; padding: 4px 0; border-top: 1px solid #1f1f29; }
  .event .t { color: var(--faint); font-family: ui-monospace, monospace; }
  .event .d { color: var(--dim); word-break: break-word; }
  pre.captured { background: #0d0d14; border-radius: 8px; padding: 10px 12px; font: 12px/1.6 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; margin: 8px 0 0; }
  form.grid { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; align-items: center; max-width: 620px; font-size: 13px; }
  form.grid label { color: var(--dim); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
