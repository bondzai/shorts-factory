# Gravity Lab, Season 0: 100 levels, one Short a day (2026-09-25 .. 2027-01-02).
# Converted from the editorial plan (02-season0-plan.md) under docs/08-series-layer.md,
# which wins on any conflict. The companion is docs/09-season0.md.
#
# - story.must / prefer use mechanism predicates only (rule 2.4): nothing here says
#   who wins, ranks or falls.
# - copy hints are seeds for the copy brain, never published as they stand. No digit
#   appears outside a placeholder (rule 2.5).
# - status: ready levels use stages that pass docs/06 today; blocked levels name the
#   WP7 mechanic they wait for; needs_input levels wait on operator_input.
# - Anchored dates: L37 2026-10-31, L63 2026-11-26, L92 2026-12-25, L98 2026-12-31.
