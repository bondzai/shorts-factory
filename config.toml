[paths]
db = "data/factory.db"
work = "data/work"
out = "data/out"

[render]
width = 1080
height = 1920
fps = 30
render_scale = 0.5
# Which renderer draws a physics clip: "pil" is the original still-frame
# drawing; "pygame" adds motion to every object — squash on impact, trails,
# sparks, glowing spinners, a burst and rings at the finish. The physics is
# identical either way; only the drawing differs.
engine = "pygame"
max_seconds = 22
# Seconds of the simulation dropped from the front, so frame one already has
# marbles bouncing rather than leaving the gate. The swipe decision is made in
# the first two seconds; the gate is the least interesting thing in the clip.
skip_start_s = 0.6
# Races per clip. Two — a heat and a final with the same marbles on a different
# stage — lands the clip in the 30-45 s band where Shorts reach is, and gives
# the viewer a marble to follow.
rounds = 2

[overlay]
# On-screen text for the opening seconds. Its one job is to make the viewer
# pick a marble: a viewer who has chosen a side stays to see it win or lose.
# Two or three words, second person, never the result and never the stage's
# numbers. Several captions separated by "|"; one is chosen per seed so
# consecutive clips do not open on the same words. The funnel sells texture
# and sound and is left clean.
seconds = 2.6
# Caption height as a fraction of the frame's width. Studio says three of
# four viewers leave before the race resolves, so the one thing on screen in
# that second is drawn to be read at arm's length, not to be tasteful.
size = 0.115
# What the clip asks for once the result is in, on screen for the second or
# so the race keeps running after the winner crosses. It cannot compete with
# the hook because the hook is long over. Empty turns it off.
cta = "COMMENT YOUR PICK"
cta_seconds = 1.3
marble_race = "PICK ONE | PICK YOUR MARBLE | CALL IT NOW | WHICH ONE IS YOURS? | ONLY ONE GETS OUT | DON'T BLINK | BET ON ONE"
funnel_drop = ""
# The arena: four balls, health bars, last one standing. Same job — pick a side.
ball_battle = "PICK A FIGHTER | PICK YOUR FIGHTER | WHO SURVIVES? | LAST ONE STANDING | BACK ONE | CALL THE WINNER"

[notify]
# Where to tell YOU that a run finished. Slack, Discord, ntfy and any endpoint
# that accepts a JSON POST all work — the payload carries a plain `text` line
# plus the structured fields. Empty disables it.
# This points away from this machine on purpose: the CLI, the web UI and the MCP
# server share one database, so none of them needs telling what the others did.
webhook_url = ""   # or FACTORY_WEBHOOK_URL in .env, which wins and stays out of git
# A daily reminder, at this local time (publish.timezone), of how many approved
# clips are waiting to be uploaded — sent only while `factory serve` is running.
# Empty disables it. 05:45 is a quarter of an hour before the US-evening slot.
daily_at = "05:45"
on = ["run.failed", "task.finished", "clip.qc", "clip.published", "clip.failed",
      "clip.publish_failed", "clip.retitled", "clip.approved"]

[retention]
# Days to keep the rendered file after a clip's outcome is settled. -1 keeps it
# forever. Intermediates (the silent mp4 and the wav) are always dropped as
# soon as the muxed clip exists — clip.mp4 already contains both.
rejected_days = 3
published_days = 30
# Traces (trace.npz/json) of approved and published clips: what long-form
# videos are redrawn from. -1 keeps them forever; rejected traces follow
# rejected_days.
trace_days = -1

[series]
# docs/08-series-layer.md. A channel with no season/ folder ignores all this.
# Seeds tried per level before it fails as story_unsatisfiable.
max_story_attempts = 200
# Of the seeds that pass `must`, how many to score on `prefer` before choosing.
prefer_pool = 5
# Whether a season may require who wins, ranks or falls. Off: searching seeds
# until a named marble loses is choosing the result (docs/08 rule 2.4).
allow_identity_constraints = false
# Copy for level clips: "local" asks the copy brain and falls back to the
# template; "template" never asks.
copy_source = "local"

[qc]
min_seconds = 10
max_seconds = 60
target_lufs = -14.0
lufs_tolerance = 3.5
max_sameness = 0.88
min_hook_strength = 3

[llm]
# Default for any agent without its own entry below.
model = "claude-opus-5"
# Who writes a clip's title, description and pinned question.
#   template  from the facts and the channel's rules; no model, no cost, no
#             wait. What the rules already fix, and what the agents were
#             writing anyway.
#   agent     the Metadata brain below — for taste, or for a generator the
#             template does not know (it only writes marble races).
metadata_source = "template"
# Sampled frames are shrunk to this long edge before any brain sees them.
# 1080x1920 was 2-3 thousand tokens an image; 768 is a fifth of that and
# every marble is still plain to see.
image_long_edge = 768

# The brains a clip can use. A local one costs nothing and needs no key;
# `factory brains` shows which are ready, `factory brains --test ollama`
# does one round trip. The Settings -> Brains page edits the same list.
[[llm.providers]]
id = "anthropic"
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
vision = true
json_mode = "schema"
models = ["claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5"]

[[llm.providers]]
id = "ollama"
kind = "openai"
base_url = "http://localhost:11434/v1"
vision = true
json_mode = "object"
free = true
# QC and (when on) Metadata look at frames, so they need a model that can:
# qwen2.5vl:7b is the one that fits in 16 GB with room for the render.
# Idea and Analyst read text only; a text model is faster.
models = ["qwen2.5vl:7b", "qwen2.5:7b", "llama3.1:8b"]

[llm.agents]
# The four agents are not the same job. Analyst reasons about a table of
# numbers and is the one place a weaker model shows; QC scores a hook from four
# frames; Idea picks a variant and a seed. Start them all on the default, then
# step the cheap ones down and watch `factory cost --by agent` and the
# retention numbers together — a QC that got worse shows up as clips you
# reject by hand.
# provider/model. A bare model name means anthropic. To make clips without
# spending a token — Claude and Codex kept for development only — point the
# four at ollama once its models are pulled (`ollama pull qwen2.5vl:7b`):
#   idea = "ollama/qwen2.5:7b"        metadata = "ollama/qwen2.5vl:7b"
#   qc = "ollama/qwen2.5vl:7b"        analyst = "ollama/qwen2.5:7b"
# With metadata_source = "template", the Metadata brain is only used for a
# generator the template does not write.
idea = "ollama/qwen2.5vl:7b"
metadata = "ollama/qwen2.5vl:7b"
# Season copy (title, pin, description line, hook): text only, so a text model.
copy = "ollama/qwen2.5:7b"
qc = "ollama/qwen2.5vl:7b"
analyst = "ollama/qwen2.5vl:7b"

[llm.pricing]
# USD per million tokens, [input, output]. A model missing here is billed at
# the default rate and logged as an estimate rather than silently costed wrong.
"claude-opus-5" = [5.0, 25.0]
"claude-sonnet-5" = [2.0, 10.0]
"claude-haiku-4-5" = [1.0, 5.0]
default = [5.0, 25.0]

[themes]
# "" picks by calendar (see factory/themes.py); a theme id forces it.
force = ""

[titles]
# Suggested titles (the button on a clip). The rules say no emoji; this is
# the switch for the day a number says otherwise.
emoji = false

[analyst]
min_published_for_rules = 30

[publish]
driver = "manual"
# --- the youtube driver (factory youtube connect). Uploads are private with a
# publishAt, so a clip goes public at the slot below and never a minute before.
#   scheduled  private now, public at the next slot        (the default)
#   private    private, and you flip it in Studio
#   public     straight to public — on purpose, or not at all
youtube_privacy = "scheduled"
youtube_category_id = "24"          # 24 = Entertainment
youtube_language = "en"
youtube_made_for_kids = false       # required by YouTube; false for this channel
youtube_notify_subscribers = true
# Post the clip's question as a top comment. The API cannot pin it; pinning is
# two taps in Studio, and the comment is there waiting when you do.
youtube_post_comment = true
# When to upload, in your local time, chosen for the audience: 06:00 in
# Bangkok is 18:00-19:00 in New York, the evening slot with the highest CPM.
# "Copy for upload" prints the next slot, and the daily reminder fires just
# before it.
best_time = "06:00"
timezone = "Asia/Bangkok"
