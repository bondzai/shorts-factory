[paths]
db = "data/factory.db"
work = "data/work"
out = "data/out"

[render]
width = 1080
height = 1920
fps = 30
render_scale = 0.5
max_seconds = 22

[overlay]
# On-screen text for the opening seconds. A viewer only waits for an outcome
# they know exists, so the race asks its question out loud; the funnel sells
# texture and sound and is left clean.
seconds = 2.6
marble_race = "WHICH ONE WINS?"
funnel_drop = ""

[qc]
min_seconds = 10
max_seconds = 60
target_lufs = -14.0
lufs_tolerance = 3.5
max_sameness = 0.88
min_hook_strength = 3

[llm]
model = "claude-opus-5"
input_usd_per_mtok = 5.0
output_usd_per_mtok = 25.0

[analyst]
min_published_for_rules = 30

[publish]
driver = "manual"
